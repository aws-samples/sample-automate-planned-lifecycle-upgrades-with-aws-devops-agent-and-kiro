AWSTemplateFormatVersion: '2010-09-09'
Description: AWS DevOps Agent Space for Amazon EKS upgrade POC

Parameters:
  NameSuffix:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9-]{1,20}$'
    Description: >
      Optional suffix appended to named resources so multiple deployments can
      coexist in the same account/region. Lowercase alphanumeric and hyphens,
      1-20 chars. Leave empty for a single default deployment.
  GitHubRepo:
    Type: String
    Description: GitHub repo (owner/name) that hosts the upgrade workflows.
  ClusterName:
    Type: String
    Default: eks-upgrade-poc
    Description: >
      EKS cluster name (without the NameSuffix — the suffix is applied
      automatically to match the CDK stack).
  DevOpsAgentSdkLayerBucket:
    Type: String
    Description: >
      S3 bucket containing the devops-agent-sdk Lambda layer artifact
      (layer.zip — bundles a boto3 version that knows about the
      `devops-agent` service, since the Lambda runtime's bundled boto3
      doesn't). bootstrap.sh uploads the artifact and passes the bucket
      and key in.
  DevOpsAgentSdkLayerKey:
    Type: String
    Description: >
      S3 key for the devops-agent-sdk Lambda layer artifact (e.g.
      `lambda-layers/devops-agent-sdk/layer-<sha>.zip`). Must match what
      bootstrap.sh uploaded.

Conditions:
  HasSuffix: !Not [!Equals [!Ref NameSuffix, '']]

Resources:
  # ---------------------------------------------------------------------------
  # DevOps Agent space + IAM
  # ---------------------------------------------------------------------------
  DevOpsAgentSpaceRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: >
              The '*' resource applies only to read-only investigation actions
              (eks:Describe*/List*, cloudformation:Describe*/Get*/List*,
              cloudtrail:LookupEvents) which do not support resource-level ARN
              scoping.
          - id: W28
            reason: >
              Explicit role name is intentional and referenced by the DevOps
              Agent space configuration; replacement on update is not expected.
    Properties:
      RoleName: !If
        - HasSuffix
        - !Sub DevOpsAgentRole-AgentSpace-${NameSuffix}
        - DevOpsAgentRole-AgentSpace
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: aidevops.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:aidevops:${AWS::Region}:${AWS::AccountId}:agentspace/*
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AIDevOpsAgentAccessPolicy
      Policies:
        - PolicyName: AllowCreateServiceLinkedRoles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/resource-explorer-2.amazonaws.com/AWSServiceRoleForResourceExplorer
        - PolicyName: AllowReadOnlyInvestigationApis
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                  - eks:DescribeUpdate
                  - eks:ListUpdates
                  - eks:DescribeAddonVersions
                  - eks:DescribeCluster
                  - eks:DescribeAddon
                  - eks:ListAddons
                  - eks:DescribeNodegroup
                  - eks:ListNodegroups
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                Resource: '*'

  DevOpsOperatorRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >
              Explicit role name is intentional and referenced operationally;
              replacement on update is not expected.
    Properties:
      RoleName: !If
        - HasSuffix
        - !Sub DevOpsAgentRole-WebappAdmin-${NameSuffix}
        - DevOpsAgentRole-WebappAdmin
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: aidevops.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:aidevops:${AWS::Region}:${AWS::AccountId}:agentspace/*
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AIDevOpsOperatorAppAccessPolicy

  AgentSpace:
    Type: AWS::DevOpsAgent::AgentSpace
    DependsOn:
      - DevOpsAgentSpaceRole
      - DevOpsOperatorRole
    Properties:
      Name: !If
        - HasSuffix
        - !Sub ${ClusterName}-${NameSuffix}
        - !Ref ClusterName
      Description: EKS upgrade POC - upgrade planning, failure RCA, and mitigation
      OperatorApp:
        Iam:
          OperatorAppRoleArn: !GetAtt DevOpsOperatorRole.Arn

  MonitorAssociation:
    Type: AWS::DevOpsAgent::Association
    Properties:
      AgentSpaceId: !GetAtt AgentSpace.AgentSpaceId
      ServiceId: aws
      Configuration:
        Aws:
          AssumableRoleArn: !GetAtt DevOpsAgentSpaceRole.Arn
          AccountId: !Ref AWS::AccountId
          AccountType: monitor

  SecretsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Customer-managed key for DevOps Agent pipeline secrets
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # Grants the account root full access to the key. This is the
          # AWS-recommended default key policy: it delegates access control to
          # IAM policies (a key with no such statement can become unmanageable).
          # For production, consider replacing 'kms:*' with only the actions the
          # workload needs (e.g. kms:Decrypt, kms:Encrypt, kms:GenerateDataKey,
          # kms:DescribeKey) and scoping the principal to specific roles.
          - Sid: AllowAccountRoot
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  SecretsKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !If
        - HasSuffix
        - !Sub 'alias/devops-agent-secrets-${NameSuffix}'
        - alias/devops-agent-secrets
      TargetKeyId: !Ref SecretsKmsKey

  # ---------------------------------------------------------------------------
  # Dead letter queue — shared by all pipeline Lambdas. Captures async
  # invocation payloads that fail after Lambda's automatic retries so failures
  # can be inspected rather than silently dropped.
  # ---------------------------------------------------------------------------
  LambdaDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !If
        - HasSuffix
        - !Sub devops-agent-lambda-dlq-${NameSuffix}
        - devops-agent-lambda-dlq
      MessageRetentionPeriod: 1209600  # 14 days (maximum)
      KmsMasterKeyId: !Ref SecretsKmsKey
      KmsDataKeyReusePeriodSeconds: 300

  # ---------------------------------------------------------------------------
  # Secrets
  # ---------------------------------------------------------------------------
  GitHubTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !If
        - HasSuffix
        - !Sub devops-agent/github-pat-${NameSuffix}
        - devops-agent/github-pat
      Description: >
        GitHub PAT for triggering workflow_dispatch on eks-upgrade.yml and
        next-steps.yml. Needs Actions: read+write, Contents: read+write,
        Pull requests: read+write on this repo. See README Step 4.
      SecretString: PLACEHOLDER  # checkov:skip=CKV_SECRET_6 literal placeholder, real PAT set out-of-band post-deploy (README Step 4)
      KmsKeyId: !GetAtt SecretsKmsKey.Arn

  WebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !If
        - HasSuffix
        - !Sub devops-agent/webhook-credentials-${NameSuffix}
        - devops-agent/webhook-credentials
      Description: >
        DevOps Agent generic webhook credentials. After deploying this stack,
        generate a webhook in the DevOps Agent console (Capabilities > Webhook >
        Generate), then update this secret with JSON:
        {"url":"<webhook-url>","secret":"<hmac-secret>"}
      SecretString: '{"url":"PLACEHOLDER","secret":"PLACEHOLDER"}'  # checkov:skip=CKV_SECRET_6 literal placeholders, real credentials set out-of-band post-deploy (see Description)
      KmsKeyId: !GetAtt SecretsKmsKey.Arn

  # ---------------------------------------------------------------------------
  # SNS topic — operator notifications when a mitigation plan completes.
  # The Trigger Lambda extracts the agent's "## Immediate Steps" section and
  # publishes it here along with a link to the (forthcoming) Agent Spec PR
  # so on-call sees the urgent actions in their inbox/Slack/PagerDuty before
  # they read the full spec.
  # ---------------------------------------------------------------------------
  MitigationNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !If
        - HasSuffix
        - !Sub eks-upgrade-failure-mitigation-${NameSuffix}
        - eks-upgrade-failure-mitigation
      DisplayName: EKS Upgrade Failure Mitigation
      KmsMasterKeyId: alias/aws/sns


  # ---------------------------------------------------------------------------
  # EventBridge diagnostic logging
  # Every rule below targets this log group as a secondary destination so
  # matched events land here alongside the Lambda invocation. Useful for
  # diagnosing "did my event match" issues.
  # ---------------------------------------------------------------------------
  EventBridgeLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: >
              This log group holds only EventBridge event-match diagnostics (no
              secrets or customer data); default CloudWatch Logs encryption is
              sufficient for this POC.
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: >
              Log group holds only EventBridge event-match diagnostics (no
              secrets or customer data); default CloudWatch Logs encryption is
              sufficient for this POC.
    Properties:
      LogGroupName: !If
        - HasSuffix
        - !Sub /aws/events/eks-upgrade-pipeline-${NameSuffix}
        - /aws/events/eks-upgrade-pipeline
      RetentionInDays: 14

  EventBridgeLogGroupPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !If
        - HasSuffix
        - !Sub EventBridgeToCWLogs-${NameSuffix}
        - EventBridgeToCWLogs
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": { "Service": ["events.amazonaws.com", "delivery.logs.amazonaws.com"] },
            "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
            "Resource": "${EventBridgeLogGroup.Arn}"
          }]
        }

  # ---------------------------------------------------------------------------
  # SNS topic — skill update notifications when the daily review finds gaps.
  # ---------------------------------------------------------------------------
  SkillUpdateNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !If
        - HasSuffix
        - !Sub eks-skill-update-notifications-${NameSuffix}
        - eks-skill-update-notifications
      DisplayName: EKS Skill Update Notifications
      KmsMasterKeyId: alias/aws/sns

  # ---------------------------------------------------------------------------
  # Skill Review Lambda — daily kickoff that fetches current skills from GitHub
  # and posts a webhook to trigger an eks-skill-review investigation.
  # ---------------------------------------------------------------------------
  SkillReviewLambdaRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >
              Explicit role name is intentional; replacement on update is not
              expected.
    Properties:
      RoleName: !If
        - HasSuffix
        - !Sub DevOpsAgent-SkillReviewLambda-${NameSuffix}
        - DevOpsAgent-SkillReviewLambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref WebhookSecret
                  - !Ref GitHubTokenSecret
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !GetAtt SecretsKmsKey.Arn
        - PolicyName: SendToDeadLetterQueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt LambdaDeadLetterQueue.Arn

  SkillReviewLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: >
              This function only calls AWS service APIs (Secrets Manager, KMS,
              GitHub over the public internet); it accesses no VPC resources, so
              VPC attachment would add NAT cost and cold-start latency with no
              security benefit.
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >
              Function calls only AWS/GitHub APIs over the public internet; no
              VPC resources are accessed, so VPC attachment adds cost/latency
              with no security benefit.
          - id: CKV_AWS_173
            comment: >
              Environment variables hold only resource references (Secrets
              Manager ARNs, repo/topic/cluster names) — no secret material. The
              actual secrets live in Secrets Manager, KMS-encrypted.
    Properties:
      FunctionName: !If
        - HasSuffix
        - !Sub devops-agent-skill-review-trigger-${NameSuffix}
        - devops-agent-skill-review-trigger
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt SkillReviewLambdaRole.Arn
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json, os, hmac, hashlib, base64, http.client, urllib.request, urllib.error, boto3
          from datetime import datetime, timezone

          # Every skill the daily review examines, including the review skill
          # itself — its verification guidance and output contract go stale the
          # same way the operational skills do, and nothing else audits it.
          SKILL_PATHS = [
              'skills/eks-upgrade-planning/SKILL.md',
              'skills/eks-failure-root-cause/SKILL.md',
              'skills/eks-investigation-triage-rules/SKILL.md',
              'skills/eks-skill-review/SKILL.md',
          ]

          def _fetch_file_from_github(token, repo, path, ref='main'):
              """Fetch a file from GitHub via Contents API (returns decoded text)."""
              host = 'api.github.com'
              api_path = f'/repos/{repo}/contents/{path}?ref={ref}'
              conn = http.client.HTTPSConnection(host, timeout=15)
              try:
                  conn.request('GET', api_path, headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github.v3.raw',
                      'User-Agent': 'devops-agent-skill-review/1.0',
                  })
                  resp = conn.getresponse()
                  if resp.status != 200:
                      body = resp.read().decode(errors='replace')[:500]
                      print(f"WARNING: GitHub {resp.status} for {path}: {body}")
                      return None
                  return resp.read().decode()
              finally:
                  conn.close()

          def handler(event, context):
              sm = boto3.client('secretsmanager')

              # Fetch GitHub PAT to read current skills
              token = sm.get_secret_value(SecretId=os.environ['GITHUB_TOKEN_SECRET'])['SecretString']  # checkov:skip=CKV_SECRET_6 SDK call, not a hardcoded secret
              if token == 'PLACEHOLDER':
                  raise ValueError("GitHub PAT not configured (see README Step 4).")

              # Fetch webhook credentials
              creds = json.loads(sm.get_secret_value(SecretId=os.environ['WEBHOOK_SECRET'])['SecretString'])  # checkov:skip=CKV_SECRET_6 SDK call, not a hardcoded secret
              webhook_url = creds['url']
              webhook_secret = creds['secret']
              if webhook_url == 'PLACEHOLDER' or webhook_secret == 'PLACEHOLDER':
                  raise ValueError("Webhook secret not configured (see README Step 3).")

              repo = os.environ['GITHUB_REPO']

              # Fetch current skill content from GitHub
              skill_content_sections = []
              for path in SKILL_PATHS:
                  content = _fetch_file_from_github(token, repo, path)
                  if content:
                      skill_content_sections.append(f"### {path}\n\n{content}")
                  else:
                      skill_content_sections.append(f"### {path}\n\n(FETCH FAILED — skip this skill)")

              now = datetime.now(timezone.utc)
              iso_ts = now.strftime('%Y-%m-%dT%H:%M:%S.%f')[:-3] + 'Z'
              timestamp = now.strftime('%Y-%m-%dT%H:%M:%S.000Z')
              review_date = now.strftime('%Y-%m-%d')

              description = (
                  f"Perform daily skill review for EKS upgrade pipeline.\n"
                  f"Date: {review_date}\n\n"
                  f"Follow the eks-skill-review skill. Compare the current skill content "
                  f"below against live AWS APIs and documentation. Produce a Skill Update "
                  f"Spec with any needed changes, or state CHANGES_FOUND: NO if all skills "
                  f"are current.\n\n"
                  f"## Current Skill Content\n\n"
                  + "\n\n".join(skill_content_sections)
              )

              incident_id = f"skill-review-{now.strftime('%Y%m%d%H%M%S')}"
              payload = json.dumps({
                  'eventType': 'incident',
                  'incidentId': incident_id,
                  'action': 'created',
                  'priority': 'LOW',
                  'title': f"Daily EKS custom skills review — {review_date}",
                  'description': description,
                  'timestamp': timestamp,
                  'service': 'SkillReview',
                  'data': {'reviewDate': review_date},
              })

              sig = base64.b64encode(
                  hmac.new(webhook_secret.encode(), f"{timestamp}:{payload}".encode(), hashlib.sha256).digest()
              ).decode()

              print(f"POSTing skill review webhook: incident_id={incident_id}")
              req = urllib.request.Request(webhook_url, data=payload.encode(), headers={
                  'Content-Type': 'application/json',
                  'x-amzn-event-timestamp': timestamp,
                  'x-amzn-event-signature': sig,
              }, method='POST')
              try:
                  resp = urllib.request.urlopen(req)
                  print(f"Webhook success: status={resp.status}")
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors='replace')[:1000]
                  print(f"ERROR: webhook POST {e.code}: {body}")
                  raise
              except urllib.error.URLError as e:
                  print(f"ERROR: webhook network failure: {e.reason}")
                  raise
              return {'statusCode': 200, 'incidentId': incident_id}
      Environment:
        Variables:
          WEBHOOK_SECRET: !Ref WebhookSecret
          GITHUB_TOKEN_SECRET: !Ref GitHubTokenSecret
          GITHUB_REPO: !Ref GitHubRepo

  SkillReviewLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SkillReviewLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SkillReviewScheduleRule.Arn

  SkillReviewScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !If
        - HasSuffix
        - !Sub eks-skill-review-daily-${NameSuffix}
        - eks-skill-review-daily
      Description: Daily trigger for EKS skill review (08:00 UTC)
      ScheduleExpression: 'cron(0 8 * * ? *)'
      State: ENABLED
      Targets:
        - Id: SkillReviewLambda
          Arn: !GetAtt SkillReviewLambda.Arn

  # ---------------------------------------------------------------------------
  # Health Lambda — opens an upgrade-planning investigation on the agent
  # ---------------------------------------------------------------------------
  HealthEventLambdaRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >
              Explicit role name is intentional; replacement on update is not
              expected.
    Properties:
      RoleName: !If
        - HasSuffix
        - !Sub DevOpsAgent-HealthEventLambda-${NameSuffix}
        - DevOpsAgent-HealthEventLambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GetWebhookSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref WebhookSecret
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !GetAtt SecretsKmsKey.Arn
        - PolicyName: SendToDeadLetterQueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt LambdaDeadLetterQueue.Arn

  HealthEventLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: >
              This function only calls AWS service APIs (Secrets Manager, KMS,
              DevOps Agent); it accesses no VPC resources, so VPC attachment
              would add NAT cost and cold-start latency with no security benefit.
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >
              Function calls only AWS service APIs; no VPC resources are
              accessed, so VPC attachment adds cost/latency with no security
              benefit.
          - id: CKV_AWS_173
            comment: >
              Environment variables hold only resource references (Secrets
              Manager ARNs, repo/topic/cluster names) — no secret material. The
              actual secrets live in Secrets Manager, KMS-encrypted.
    Properties:
      FunctionName: !If
        - HasSuffix
        - !Sub devops-agent-health-event-${NameSuffix}
        - devops-agent-health-event
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt HealthEventLambdaRole.Arn
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json, os, hmac, hashlib, base64, urllib.request, urllib.error, boto3
          from datetime import datetime, timezone

          def handler(event, context):
              detail = event['detail']
              service = detail.get('service', 'UNKNOWN')
              event_code = detail.get('eventTypeCode', '')
              entities = [e['entityValue'] for e in detail.get('affectedEntities', []) if e.get('status') == 'PENDING']
              print(f"Health event: service={service} code={event_code} affected={len(entities)}")

              sm = boto3.client('secretsmanager')
              creds = json.loads(sm.get_secret_value(SecretId=os.environ['WEBHOOK_SECRET'])['SecretString'])  # checkov:skip=CKV_SECRET_6 SDK call, not a hardcoded secret
              webhook_url = creds['url']
              webhook_secret = creds['secret']
              if webhook_url == 'PLACEHOLDER' or webhook_secret == 'PLACEHOLDER':
                  raise ValueError("Webhook secret not configured. Update the secret in Secrets Manager (see README Step 3).")

              now = datetime.now(timezone.utc)
              timestamp = now.strftime('%Y-%m-%dT%H:%M:%S.000Z')
              iso_ts = now.strftime('%Y-%m-%dT%H:%M:%S.%f')[:-3] + 'Z'
              region = detail.get('eventRegion', 'us-east-1')

              cluster_name = 'unknown'
              for arn in entities:
                  if ':cluster/' in arn:
                      cluster_name = arn.split(':cluster/')[-1]
                      break
              if cluster_name == 'unknown':
                  print(f"WARNING: could not extract cluster name from entities (code={event_code}, entities={entities})")

              title = f"EKS upgrade planning: {cluster_name} ({region}) — {iso_ts}"
              description = (
                  f"Investigation details: Plan an upgrade for EKS cluster {cluster_name} in {region}.\n\n"
                  f"Follow the eks-upgrade-planning skill. You MUST include the CDK Change Spec block "
                  f"in your summary with exact addon version strings from the AWS API.\n\n"
                  f"Query describe-addon-versions for each addon to get the latest compatible versions. "
                  f"Include the full eksbuild version strings in your output. "
                  f"Investigation starting point: EKS cluster {cluster_name} in {region} "
                  f"Date and time of incident: {iso_ts}"
              )

              incident_id = f"health-{event_code}-{now.strftime('%Y%m%d%H%M%S')}"
              # Open a brand new investigation. No parent linking — this is the
              # entry point of the upgrade-planning path.
              payload = json.dumps({
                  'eventType': 'incident',
                  'incidentId': incident_id,
                  'action': 'created',
                  'priority': 'HIGH',
                  'title': title,
                  'description': description,
                  'timestamp': timestamp,
                  'service': 'AWSHealth',
                  'data': detail
              })
              sig = base64.b64encode(
                  hmac.new(webhook_secret.encode(), f"{timestamp}:{payload}".encode(), hashlib.sha256).digest()
              ).decode()

              print(f"POSTing webhook to DevOps Agent: incident_id={incident_id} cluster={cluster_name}")
              req = urllib.request.Request(webhook_url, data=payload.encode(), headers={
                  'Content-Type': 'application/json',
                  'x-amzn-event-timestamp': timestamp,
                  'x-amzn-event-signature': sig,
              }, method='POST')
              try:
                  resp = urllib.request.urlopen(req)
                  print(f"Webhook success: status={resp.status} incident_id={incident_id}")
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors='replace')[:1000]
                  print(f"ERROR: webhook POST {e.code} for incident_id={incident_id}: {body}")
                  raise
              except urllib.error.URLError as e:
                  print(f"ERROR: webhook network failure for incident_id={incident_id}: {e.reason}")
                  raise
              return {'statusCode': 200}
      Environment:
        Variables:
          WEBHOOK_SECRET: !Ref WebhookSecret

  HealthEventLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HealthEventLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HealthPlannedLifecycleRule.Arn

  HealthPlannedLifecycleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !If
        - HasSuffix
        - !Sub eks-health-planned-lifecycle-${NameSuffix}
        - eks-health-planned-lifecycle
      EventPattern:
        source:
          - aws.health
        detail-type:
          - AWS Health Event
